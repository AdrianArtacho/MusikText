<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MusicXML Lyric Player</title>
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>

  <style>
    body { font-family: sans-serif; padding: 2rem; }

    button {
      font-size: 1rem;
      padding: .5rem 1rem;
      margin-left: .5rem;
    }

    #lyrics {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 2rem;
      align-items: flex-start;
    }

    .wordItem {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .word {
      border: 2px solid black;
      border-radius: .4rem;
      padding: .5rem .8rem;
      font-size: 1.4rem;
      min-width: 1.5rem;
      text-align: center;
      transition: background .1s, color .1s, transform .1s;
    }

    .altTexts {
      margin-top: .25rem;
      color: #aaa;
      font-size: 1rem;
      line-height: 1.15;
      text-align: center;
      min-height: 1.1em;
    }

    .altText {
      display: block;
    }

    .active {
      background: black;
      color: white;
      transform: scale(1.08);
    }
  </style>
</head>

<body>

<h1>MusicXML Lyric Player</h1>

<input type="file" id="file" accept=".musicxml,.xml">
<button id="play">Play</button>
<button id="stop">Stop</button>

<div id="lyrics"></div>

<script>
let events = [];
let words = [];
let synth = null;

function pitchToMidi(step, alter, octave) {
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[step];
  return 12 * (parseInt(octave) + 1) + base + parseInt(alter || 0);
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function clearActiveWords() {
  document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
}

function wordIndexForEvent(eventIndex) {
  return words.findIndex(word => word.eventIndexes.includes(eventIndex));
}

function getTempo(xml) {
  const soundTempo = xml.querySelector("sound[tempo]")?.getAttribute("tempo");
  if (soundTempo) return parseFloat(soundTempo);

  const perMinute = xml.querySelector("per-minute")?.textContent;
  if (perMinute) return parseFloat(perMinute);

  return 90;
}

function getLyricTexts(lyric) {
  const texts = [...(lyric?.querySelectorAll("text") || [])]
    .map(t => t.textContent.trim());

  return {
    main: texts[0] || "",
    alternatives: texts.slice(1)
  };
}

function appendSyllable(word, mainText, alternatives, eventIndex) {
  word.text += mainText;

  alternatives.forEach((alt, i) => {
    if (!word.alternatives[i]) word.alternatives[i] = "";
    word.alternatives[i] += alt;
  });

  word.eventIndexes.push(eventIndex);
}

document.getElementById("file").addEventListener("change", async e => {
  const text = await e.target.files[0].text();
  const xml = new DOMParser().parseFromString(text, "application/xml");

  const divisions = parseFloat(xml.querySelector("divisions")?.textContent || 1);
  const tempo = getTempo(xml);
  const beatSeconds = 60 / tempo;

  events = [];
  words = [];

  let time = 0;
  let currentWord = null;

  xml.querySelectorAll("note").forEach(note => {
    const isRest = note.querySelector("rest");
    const isChord = note.querySelector("chord");
    const duration = parseFloat(note.querySelector("duration")?.textContent || 1);
    const durSeconds = duration / divisions * beatSeconds;

    if (!isRest && note.querySelector("pitch")) {
      const step = note.querySelector("step").textContent;
      const alter = note.querySelector("alter")?.textContent || 0;
      const octave = note.querySelector("octave").textContent;

      const lyric = note.querySelector("lyric");
      const syllabic = lyric?.querySelector("syllabic")?.textContent || "single";
      const { main, alternatives } = getLyricTexts(lyric);

      const eventIndex = events.length;

      events.push({
        time,
        duration: durSeconds,
        midi: pitchToMidi(step, alter, octave),
        lyric: main,
        alternatives
      });

      if (main || alternatives.length) {
        if (syllabic === "single") {
          words.push({
            text: main,
            alternatives: [...alternatives],
            eventIndexes: [eventIndex]
          });
        }

        else if (syllabic === "begin") {
          currentWord = {
            text: main,
            alternatives: [...alternatives],
            eventIndexes: [eventIndex]
          };
        }

        else if (syllabic === "middle") {
          if (!currentWord) {
            currentWord = {
              text: main,
              alternatives: [...alternatives],
              eventIndexes: [eventIndex]
            };
          } else {
            appendSyllable(currentWord, main, alternatives, eventIndex);
          }
        }

        else if (syllabic === "end") {
          if (!currentWord) {
            currentWord = {
              text: main,
              alternatives: [...alternatives],
              eventIndexes: [eventIndex]
            };
          } else {
            appendSyllable(currentWord, main, alternatives, eventIndex);
          }

          words.push(currentWord);
          currentWord = null;
        }
      }
    }

    if (!isChord) time += durSeconds;
  });

  const lyricsDiv = document.getElementById("lyrics");
  lyricsDiv.innerHTML = "";

  words.forEach((word, i) => {
    const item = document.createElement("div");
    item.className = "wordItem";
    item.id = "word-" + i;

    const box = document.createElement("div");
    box.className = "word";
    box.textContent = word.text || "–";

    const altContainer = document.createElement("div");
    altContainer.className = "altTexts";

    word.alternatives.forEach(altText => {
      const alt = document.createElement("span");
      alt.className = "altText";
      alt.textContent = altText;
      altContainer.appendChild(alt);
    });

    item.appendChild(box);
    item.appendChild(altContainer);
    lyricsDiv.appendChild(item);
  });
});

document.getElementById("play").addEventListener("click", async () => {
  if (!events.length) return;

  await Tone.start();

  if (!synth) synth = new Tone.Synth().toDestination();

  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.position = 0;

  clearActiveWords();

  events.forEach((ev, eventIndex) => {
    Tone.Transport.schedule(time => {
      synth.triggerAttackRelease(midiToFreq(ev.midi), ev.duration, time);

      const wordIndex = wordIndexForEvent(eventIndex);

      clearActiveWords();
      if (wordIndex >= 0) {
        document.querySelector("#word-" + wordIndex + " .word")?.classList.add("active");
      }
    }, ev.time);
  });

  const lastEvent = events[events.length - 1];

  Tone.Transport.schedule(() => {
    clearActiveWords();
    Tone.Transport.stop();
  }, lastEvent.time + lastEvent.duration + 0.2);

  Tone.Transport.start();
});

document.getElementById("stop").addEventListener("click", () => {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  clearActiveWords();
});
</script>

</body>
</html>
