<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MusicXML Lyric Player</title>
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>

  <style>
    :root {
      --word-font-size: 48px;
      --alt-font-size: 24px;
      --title-font-size: 56px;
    }

    body {
      font-family: sans-serif;
      padding: 1rem 2rem 2rem;
      margin: 0;
    }

    body.hasBackground {
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body.hasBackground::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.72);
      z-index: -1;
      pointer-events: none;
    }

    #controls {
      font-size: 0.75rem;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      align-items: center;
    }

    #controls input,
    #controls button {
      font-size: 0.75rem;
      padding: .2rem .35rem;
    }

    #controls input[type="number"] {
      width: 4.5rem;
    }

    #scoreTitle {
      font-size: var(--title-font-size);
      line-height: 1.05;
      margin: .4rem 0 1.2rem;
      text-align: center;
    }

    #lyrics {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      width: 100%;
    }

    .lyricLine {
      display: flex;
      flex-wrap: nowrap;
      gap: .45em;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
    }

    .wordItem {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .word {
      border: 0.08em solid black;
      border-radius: .35em;
      padding: .25em .45em;
      font-size: var(--word-font-size);
      min-width: 1.2em;
      text-align: center;
      background: rgba(255,255,255,0.85);
      transition: background .1s, color .1s, transform .1s, border-color .1s;
      line-height: 1.05;
    }

    .altTexts {
      margin-top: .25em;
      color: #aaa;
      font-size: var(--alt-font-size);
      line-height: 1.12;
      text-align: center;
      min-height: 1.1em;
    }

    .altText {
      display: block;
      cursor: pointer;
      user-select: none;
    }

    .altText:hover {
      color: #555;
      text-decoration: underline;
    }

    .active {
      background: black;
      color: white !important;
      transform: scale(1.04);
    }
  </style>
</head>

<body>

<div id="controls">
  <input type="file" id="file" accept=".musicxml,.xml">
  <button id="play">Play</button>
  <button id="stop">Stop</button>

  <label>
    Tempo:
    <input id="tempo" type="number" value="90" min="20" max="300">
  </label>

  <label>
    <input id="loop" type="checkbox" checked>
    Loop
  </label>
</div>

<h1 id="scoreTitle">MusicXML Lyric Player</h1>

<div id="lyrics"></div>

<script>
let events = [];
let words = [];
let synth = null;

function getUrlParams() {
  return new URLSearchParams(window.location.search);
}

function applyUrlSettings() {
  const params = getUrlParams();

  const tempoParam = params.get("tempo");
  if (tempoParam) {
    document.getElementById("tempo").value = tempoParam;
  }

  const bgParam = params.get("bg");
  if (bgParam) {
    document.body.classList.add("hasBackground");
    document.body.style.backgroundImage = `url("bg/${encodeURIComponent(bgParam)}")`;
  }
}

async function loadFileFromUrlParam() {
  const params = getUrlParams();
  const fileParam = params.get("file");

  if (!fileParam) return;

  try {
    const response = await fetch(`INPUT/${encodeURIComponent(fileParam)}`);

    if (!response.ok) {
      alert(`Could not load INPUT/${fileParam}`);
      return;
    }

    const text = await response.text();
    await parseMusicXMLText(text);
  } catch (err) {
    console.error(err);
    alert(`Could not load INPUT/${fileParam}`);
  }
}

function pitchToMidi(step, alter, octave) {
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[step];
  return 12 * (parseInt(octave) + 1) + base + parseInt(alter || 0);
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function clearActiveWords() {
  document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
}

function wordIndexForEvent(eventIndex) {
  return words.findIndex(word => word.eventIndexes.includes(eventIndex));
}

function getScoreTitle(xml) {
  const titleCredit = [...xml.querySelectorAll("credit")]
    .find(credit => credit.querySelector("credit-type")?.textContent.trim() === "title");

  const printedTitle = titleCredit?.querySelector("credit-words")?.textContent.trim();

  return (
    printedTitle ||
    xml.querySelector("work-title")?.textContent.trim() ||
    "MusicXML Lyric Player"
  );
}

function getTempo(xml) {
  const manualTempo = parseFloat(document.getElementById("tempo").value);
  if (!isNaN(manualTempo)) return manualTempo;

  const soundTempo = xml.querySelector("sound[tempo]")?.getAttribute("tempo");
  if (soundTempo) return parseFloat(soundTempo);

  const perMinute = xml.querySelector("per-minute")?.textContent;
  if (perMinute) return parseFloat(perMinute);

  return 90;
}

function getLyricTexts(lyric) {
  return [...(lyric?.querySelectorAll("text") || [])]
    .map(t => t.textContent.trim())
    .filter(t => t.length > 0);
}

function getNoteColor(note) {
  return (
    note.getAttribute("color") ||
    note.querySelector("notehead")?.getAttribute("color") ||
    ""
  );
}

function appendSyllable(word, texts, eventIndex, noteColor) {
  texts.forEach((text, i) => {
    if (!word.variants[i]) word.variants[i] = "";
    word.variants[i] += text;
  });

  word.eventIndexes.push(eventIndex);

  if (!word.color && noteColor) {
    word.color = noteColor;
  }
}

function fitTextToScreen() {
  if (!words.length) return;

  const root = document.documentElement;
  const maxWordSize = Math.min(window.innerWidth * 0.12, 96);
  const minWordSize = 14;

  let low = minWordSize;
  let high = maxWordSize;
  let best = minWordSize;

  for (let i = 0; i < 18; i++) {
    const mid = (low + high) / 2;

    root.style.setProperty("--word-font-size", `${mid}px`);
    root.style.setProperty("--alt-font-size", `${mid * 0.45}px`);
    root.style.setProperty("--title-font-size", `${Math.min(mid * 1.15, 72)}px`);

    const lines = [...document.querySelectorAll(".lyricLine")];
    const fits = lines.every(line => line.scrollWidth <= line.clientWidth + 1);

    if (fits) {
      best = mid;
      low = mid;
    } else {
      high = mid;
    }
  }

  root.style.setProperty("--word-font-size", `${best}px`);
  root.style.setProperty("--alt-font-size", `${best * 0.45}px`);
  root.style.setProperty("--title-font-size", `${Math.min(best * 1.15, 72)}px`);
}

function renderWords() {
  const lyricsDiv = document.getElementById("lyrics");
  lyricsDiv.innerHTML = "";

  const maxLine = Math.max(...words.map(w => w.line), 0);

  for (let line = 0; line <= maxLine; line++) {
    const lineDiv = document.createElement("div");
    lineDiv.className = "lyricLine";

    words
      .filter(word => word.line === line)
      .forEach(word => {
        const wordIndex = words.indexOf(word);

        const item = document.createElement("div");
        item.className = "wordItem";
        item.id = "word-" + wordIndex;

        const box = document.createElement("div");
        box.className = "word";
        box.textContent = word.variants[0] || "–";

        if (word.color) {
          box.style.borderColor = word.color;
          box.style.color = word.color;
        }

        const altContainer = document.createElement("div");
        altContainer.className = "altTexts";

        word.variants.slice(1).forEach((altText, altIndex) => {
          const alt = document.createElement("span");
          alt.className = "altText";
          alt.textContent = altText;

          alt.addEventListener("click", () => {
            const realAltIndex = altIndex + 1;

            const temp = word.variants[0];
            word.variants[0] = word.variants[realAltIndex];
            word.variants[realAltIndex] = temp;

            renderWords();
          });

          altContainer.appendChild(alt);
        });

        item.appendChild(box);
        item.appendChild(altContainer);
        lineDiv.appendChild(item);
      });

    lyricsDiv.appendChild(lineDiv);
  }

  requestAnimationFrame(fitTextToScreen);
}

async function parseMusicXMLText(text) {
  const xml = new DOMParser().parseFromString(text, "application/xml");

  const title = getScoreTitle(xml);
  document.getElementById("scoreTitle").textContent = title;
  document.title = title;

  const divisions = parseFloat(xml.querySelector("divisions")?.textContent || 1);
  const tempo = getTempo(xml);
  const beatSeconds = 60 / tempo;

  events = [];
  words = [];

  let time = 0;
  let currentWord = null;
  let currentLine = 0;

  xml.querySelectorAll("measure").forEach((measure, measureIndex) => {
    const print = measure.querySelector("print");

    if (
      measureIndex > 0 &&
      (print?.getAttribute("new-system") === "yes" ||
       print?.getAttribute("new-page") === "yes")
    ) {
      currentLine++;
    }

    measure.querySelectorAll("note").forEach(note => {
      const isRest = note.querySelector("rest");
      const isChord = note.querySelector("chord");
      const duration = parseFloat(note.querySelector("duration")?.textContent || 1);
      const durSeconds = duration / divisions * beatSeconds;

      if (!isRest && note.querySelector("pitch")) {
        const step = note.querySelector("step").textContent;
        const alter = note.querySelector("alter")?.textContent || 0;
        const octave = note.querySelector("octave").textContent;

        const lyric = note.querySelector("lyric");
        const syllabic = lyric?.querySelector("syllabic")?.textContent || "single";
        const texts = getLyricTexts(lyric);
        const noteColor = getNoteColor(note);

        const eventIndex = events.length;

        events.push({
          time,
          duration: durSeconds,
          midi: pitchToMidi(step, alter, octave),
          texts,
          color: noteColor,
          line: currentLine
        });

        if (texts.length) {
          if (syllabic === "single") {
            words.push({
              variants: [...texts],
              eventIndexes: [eventIndex],
              color: noteColor,
              line: currentLine
            });
          }

          else if (syllabic === "begin") {
            currentWord = {
              variants: [...texts],
              eventIndexes: [eventIndex],
              color: noteColor,
              line: currentLine
            };
          }

          else if (syllabic === "middle") {
            if (!currentWord) {
              currentWord = {
                variants: [...texts],
                eventIndexes: [eventIndex],
                color: noteColor,
                line: currentLine
              };
            } else {
              appendSyllable(currentWord, texts, eventIndex, noteColor);
            }
          }

          else if (syllabic === "end") {
            if (!currentWord) {
              currentWord = {
                variants: [...texts],
                eventIndexes: [eventIndex],
                color: noteColor,
                line: currentLine
              };
            } else {
              appendSyllable(currentWord, texts, eventIndex, noteColor);
            }

            words.push(currentWord);
            currentWord = null;
          }
        }
      }

      if (!isChord) time += durSeconds;
    });
  });

  renderWords();
}

async function parseMusicXML(file) {
  const text = await file.text();
  await parseMusicXMLText(text);
}

document.getElementById("file").addEventListener("change", async e => {
  await parseMusicXML(e.target.files[0]);
});

document.getElementById("play").addEventListener("click", async () => {
  if (!events.length) return;

  await Tone.start();

  if (!synth) synth = new Tone.Synth().toDestination();

  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.position = 0;
  Tone.Transport.loop = false;

  clearActiveWords();

  events.forEach((ev, eventIndex) => {
    Tone.Transport.schedule(time => {
      synth.triggerAttackRelease(midiToFreq(ev.midi), ev.duration, time);

      const wordIndex = wordIndexForEvent(eventIndex);

      clearActiveWords();
      if (wordIndex >= 0) {
        document.querySelector("#word-" + wordIndex + " .word")?.classList.add("active");
      }
    }, ev.time);
  });

  const lastEvent = events[events.length - 1];
  const totalDuration = lastEvent.time + lastEvent.duration + 0.2;

  if (document.getElementById("loop").checked) {
    Tone.Transport.loop = true;
    Tone.Transport.loopStart = 0;
    Tone.Transport.loopEnd = totalDuration;
  } else {
    Tone.Transport.schedule(() => {
      clearActiveWords();
      Tone.Transport.stop();
    }, totalDuration);
  }

  Tone.Transport.start();
});

document.getElementById("stop").addEventListener("click", () => {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.loop = false;
  clearActiveWords();
});

window.addEventListener("resize", () => {
  requestAnimationFrame(fitTextToScreen);
});

applyUrlSettings();
loadFileFromUrlParam();
</script>

</body>
</html>
